name: Publish Docker image
on:
  push:
    branches: [ production, staging ]
  workflow_dispatch:

concurrency:
  group: publish-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  publish:
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'

    name: Build and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    name: Deploy staging VPS
    needs: publish
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging


    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7

      - name: Upload deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "infra/docker/docker-compose.staging.yml,infra/haproxy/haproxy.cfg"
          target: "~/ezvacss.xyz"
          overwrite: true

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -eu
            
            cd ~/ezvacss.xyz

            docker compose --env-file .env -f infra/docker/compose-compose.staging.yml config --quiet
            
            docker compose --env-file .env -f infra/docker/docker-compose.staging.yml pull app

            docker compose --env-file .env -f infra/docker/docker-compose.staging.yml up -d --no-build --wait --wait-timeout 60

      - name: Smoke test
        run: |
          curl -fsS \
          --retry 5 
          --retry-delay 3
          --retry-connrefused
          --connect-timeout 10
          --max-time 20
          https://staging.ezvacss.xyz/healthz