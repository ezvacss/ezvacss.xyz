services:
  postgres:
    image: postgres:17.5
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - "./postgres/data:/var/lib/postgresql/data"
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}"
        max-size: 256m

  app:
    build: ../..
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:root@postgres:5432/postgres?sslmode=disable
      - PORT=8080
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    volumes:
      - "./../../public:/app/public"
    depends_on:
      - postgres

  haproxy:
    image: haproxy:3.3.14-alpine3.24
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - ../haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - certs_data:/etc/haproxy/certs:ro
    depends_on:
      app:
        condition: service_started
      cert-init:
        condition: service_completed_successfully

  acme:
    image: neilpang/acme.sh:3.1.4
    container_name: acme
    restart: unless-stopped
    command: daemon
    environment:
      - DEPLOY_HAPROXY_HOT_RELOAD=yes
    volumes:
      - acme_data:/acme.sh
      - certs_data:/etc/haproxy/certs
      - /var/run/docker.sock:/var/run/docker.sock

  cert-init:
    image: alpine/openssl:3.5.8
    restart: "no"
    volumes:
      - certs_data:/etc/haproxy/certs
    entrypoint: >
      sh -c "
      if [ ! -f /etc/haproxy/certs/certificate.pem ]; then
        echo 'creating temporary certificate for haproxy boot...';
        openssl req -x509 -nodes -days 1 -newkey rsa:2048 -subj '/CN=localhost' -keyout /tmp/key.pem -out /tmp/cert.pem;
        cat /tmp/key.pem /tmp/cert.pem > /etc/haproxy/certs/certificate.pem;
      fi
      "

volumes:
  haproxy_data:
  acme_data:
  certs_data: