name: Unit tests
on:
  pull_request:
    branches: [ production, staging ]
  workflow_call:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1

      - name: Run unit tests
        run: go test -v ./...

permissions:
  contents: read