name: Publish Docker image
on:
  push:
    branches: [ production, staging ]
  workflow_dispatch:

concurrency:
  group: publish-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  publish:
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'

    name: Build and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    name: Deploy staging VPS
    needs: publish
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.image_digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install "ansible-core==2.20.0"
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Install Docker collection
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Prepare SSH and inventory
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          SSH_KEY: ${{ secrets.STAGING_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          unmask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '[staging]\nstaging-vps ansible_host=%s\n' \
          "$DEPLOY_HOST" > "$RUNNER_TEMP/inventory.ini"

      - name: Deploy using Ansible
        env:
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          test -n "$DEPLOY_USER"
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.ini" \
            -u "$DEPLOY_USER" \
            --private-key ~/.ssh/staging_key \
            --ssh-common-args="-o BatchMode=yes -o StrictHostKeyChecking=yes" \
            infra/ansible/deploy-staging.yml \
            -e "app_image=$APP_IMAGE"