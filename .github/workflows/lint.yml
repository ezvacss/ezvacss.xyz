name: Lint tests
on:
  pull_request:
    branches: [ production, staging ]
  workflow_call:

jobs:
  lint:
    name: Golangci lint
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.2

      - name: Run lint test
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

permissions:
  contents: read