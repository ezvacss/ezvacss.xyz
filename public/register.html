<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a secure account on ezvacss.xyz to organize, custom-tag, and track your shortened URLs.">
    <title>Create Account | ezvacss.xyz</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css?v=2">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="app-header">
        <nav class="nav-container">
            <a href="/" class="logo-link" id="logo-nav-link">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">ezvacss.xyz</span>
            </a>
            <div class="nav-menu" id="nav-menu-bar">
            </div>
        </nav>
    </header>

    <main class="main-content" style="max-width: 450px; padding: 2rem 1.5rem;">
        
        <div class="premium-card" style="box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); border-color: rgba(228, 228, 231, 0.15); padding: 2.5rem 2rem;">
            
            <h2 style="font-size: 1.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: -0.03em; text-align: center;">Register</h2>
            
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2rem; font-size: 0.9rem; line-height: 1.4;">
                Create a secure account to organize, custom-tag, and track your shortened URLs.
            </p>

            <form id="register-form" onsubmit="event.preventDefault();">
                <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                    
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label for="username-input" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">Username</label>
                        <div class="input-group">
                            <div class="input-icon-wrapper">
                                <i data-lucide="user" style="width: 1.1rem; height: 1.1rem; color: var(--text-secondary);"></i>
                            </div>
                            <input type="text" id="username-input" placeholder="Choose a username" required autocomplete="username">
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label for="password-input" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">Password</label>
                        <div class="input-group">
                            <div class="input-icon-wrapper">
                                <i data-lucide="lock" style="width: 1.1rem; height: 1.1rem; color: var(--text-secondary);"></i>
                            </div>
                            <input type="password" id="password-input" placeholder="Create password (min 6 chars)" required autocomplete="new-password">
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label for="confirm-password-input" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">Confirm Password</label>
                        <div class="input-group">
                            <div class="input-icon-wrapper">
                                <i data-lucide="lock-keyhole" style="width: 1.1rem; height: 1.1rem; color: var(--text-secondary);"></i>
                            </div>
                            <input type="password" id="confirm-password-input" placeholder="Confirm password" required autocomplete="new-password">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; margin: 0.5rem 0;">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAADv9thFyPxyOl6-p" data-theme="dark"></div>
                    </div>

                    <div id="error-message" style="display: none; color: var(--color-danger); font-size: 0.9rem; font-weight: 600; line-height: 1.4;"></div>
                    <div id="success-message" style="display: none; color: var(--color-success); font-size: 0.9rem; font-weight: 600; line-height: 1.4;"></div>

                    <button type="submit" class="nav-btn" id="register-submit-btn" style="justify-content: center; width: 100%; padding: 0.8rem;">
                        <span>Register Account</span>
                    </button>

                    <div style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                        <span style="color: var(--text-secondary);">Already have an account? </span>
                        <a href="/login" style="color: var(--text-primary); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--text-primary); padding-bottom: 2px;">Sign In</a>
                    </div>

                </div>
            </form>
        </div>

    </main>

    <footer class="app-footer">
        <div style="display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
            <a href="/unshorten" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Unshorten Link</a>
            <a href="/report" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Report Abuse</a>
            <a href="/contact" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Contact</a>
            <a href="/privacy" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Privacy</a>
            <a href="/tos" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Terms</a>
        </div>
        <p>&copy; 2026 ezvacss.xyz. Minimalist link utility.</p>
    </footer>

    <script>
        const registerForm = document.getElementById('register-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const confirmPasswordInput = document.getElementById('confirm-password-input');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('register-submit-btn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Get Turnstile token
            const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
            const turnstile_token = turnstileResponse ? turnstileResponse.value : '';

            if (!username || !password || !confirmPassword) return;

            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorMessage.textContent = 'Password must be at least 6 characters long.';
                errorMessage.style.display = 'block';
                return;
            }

            if (!turnstile_token) {
                errorMessage.textContent = 'Please complete the captcha verification.';
                errorMessage.style.display = 'block';
                return;
            }

            const btnText = submitBtn.querySelector('span');
            btnText.textContent = 'Registering...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, turnstile_token })
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Registration failed');
                }

                successMessage.textContent = 'Account created successfully! Logging you in...';
                successMessage.style.display = 'block';
                usernameInput.value = '';
                passwordInput.value = '';
                confirmPasswordInput.value = '';

                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.style.display = 'block';
                if (typeof turnstile !== 'undefined') {
                    turnstile.reset();
                }
            } finally {
                btnText.textContent = 'Register Account';
                submitBtn.disabled = false;
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
