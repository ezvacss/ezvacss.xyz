name: test.yml
on:
  push:
      branches: [ main, staging ]
  pull_request:
      branches: [ main, staging ]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
      - name: Run unit tests
        run: go test -v ./...