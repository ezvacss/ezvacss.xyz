name: test.yml
on:
  pull_request:
    branches: [ production, staging ]
  workflow_call:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Run unit tests
        run: go test -v ./...