name: Tests and docker build
on:
  push:
      branches: [ main, staging ]
  pull_request:
      branches: [ main, staging ]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
      - name: Run unit tests
        run: go test -v ./...
      - name: Build docker image
        run: docker build -t ezvacss.xyz:ci .

permissions:
  contents: read