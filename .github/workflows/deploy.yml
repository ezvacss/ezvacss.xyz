name: Deploy staging
on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'staging'
      )

    name: Deploy staging VPS
    runs-on: ubuntu-24.04
    environment: staging

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/ezvacss.xyz

            docker compose --env-file .env -f infra/docker/docker-compose.deploy.yml \pull app

            docker compose --env-file .env -f infra/docker/docker-compose.deploy.yml up -d --no-build app

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 https://staging.ezvacss.xyz/healthz