- name: Prepare staging VPS
  hosts: staging
  become: true
  gather_facts: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

- import_playbook: docker-ce.yml