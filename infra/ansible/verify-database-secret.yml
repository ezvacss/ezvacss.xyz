- name: Verify application database secret access
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read application credentials
      ansible.builtin.set_fact:
        database_credentials: >-
          {{
            lookup(
              'amazon.aws.secretsmanager_secret',
              'ezvacss/staging/database-app',
              region='eu-north-1',
              profile='default'
            ) | from_json
          }}
      no_log: true

    - name: Validate application credentials
      ansible.builtin.assert:
        that:
          - database_credentials is mapping
          - database_credentials.username | default('') == 'ezvacss_app'
          - database_credentials.password | default('') is string
          - database_credentials.password | default('') | length > 0
      no_log: true

    - name: Report successful verification
      ansible.builtin.debug:
        msg: "Application database secret retrieved and validated."